<html lang="es">

<body>
<main id="view" aria-live="polite"></main>

<nav class="tabbar" aria-label="Navegación principal">
  <a href="#/" data-tab="home">
    <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
    <span>Inicio</span>
  </a>
  <a href="#/ideas" data-tab="ideas">
    <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 21v-9"/><path d="M12 12C12 7 8 4 3 4c0 5 4 8 9 8z"/><path d="M12 14c0-4 3-7 8-7 0 4-3 7-8 7z"/></svg>
    <span>Ideas</span>
  </a>
  <a href="#/capture" class="tab-capture" aria-label="Capturar idea">
    <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </a>
  <a href="#/cine" data-tab="cine">
    <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="m3 7 3-4h4l-3 4M10 7l3-4h4l-3 4M17 7l3-4"/></svg>

  </a>
  <a href="#/agenda" data-tab="agenda">

    <span>Agenda</span>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-act="closeSheet"></div>
  <section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <header class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button class="icon-btn" data-act="closeSheet" aria-label="Cerrar">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </header>
    <div id="sheet-body"></div>
  </section>
</div>

<div id="toast" class="toast" role="status" hidden></div>
